name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validate content (production rules)
        run: npm run validate -- --mode=production
      - name: Validate content (preview rules)
        run: npm run validate -- --mode=preview
      - run: npm run typecheck
      - name: Tests (unit, integration, axe-core, token contrast)
        run: npm test
      - run: npm run build
